      responses:
        '200':
          description: Persisted website
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoWebsite' }
        '404': { description: Website not found }
        '422': { description: Validation failed with field errors }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing casinos write scope }
  /segments:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    servers:
      - url: /crm/ui-api/v1
        description: CRM browser UI prototype (no bearer token)
      - url: /crm/api/v1
        description: Secured server-to-server API
