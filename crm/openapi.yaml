openapi: 3.0.3
info:
  title: NextLuck CRM API
  version: 1.0.0
  description: |
    REST API behind the CRM Bonuses (`/crm/b/`) and Customers (`/crm/c/list/`) pages.

    ## Server-to-server authentication
    OAuth 2.0 **client credentials** grant (RFC 6749 §4.4). The calling server exchanges its `client_id` / `client_secret`
    at `POST /oauth/token` for a short-lived (15 min) signed JWT access token and sends it as `Authorization: Bearer <token>`.

    * Keep the client secret on the server only (env var / secret manager); never ship it to browsers or mobile apps.
    * Request the least-privilege scopes you need (`bonuses:read`, `bonuses:write`).
    * Cache the token until shortly before `expires_in`, then request a new one. There are no refresh tokens.
    * Always use HTTPS; token responses are `Cache-Control: no-store`.
    * Failures follow RFC 6749 / RFC 6750: `401` + `WWW-Authenticate` for missing/invalid credentials, `403` for insufficient scope.
servers:
  - url: /crm/api/v1
tags:
  - name: Authentication
  - name: Bonuses
  - name: Exchange rates
  - name: Customers
  - name: Segments
paths:
  /segments:
    servers:
      - url: /crm/ui-api/v1
        description: CRM browser UI prototype (no bearer token)
      - url: /crm/api/v1
        description: Secured server-to-server API
    get:
      tags: [Segments]
      operationId: listSegments
      summary: List persisted customer segment definitions
      security:
        - oauth2: ["segments:read"]
      responses:
        '200':
          description: Segment definitions; membership is calculated in the demo UI.
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerSegment' } }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing segments read scope }
    post:
      tags: [Segments]
      operationId: createSegment
      summary: Create a validated segment
      security:
        - oauth2: ["segments:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSegmentWrite' }
      responses:
        '201':
          description: Persisted segment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSegment' }
        '422': { description: Invalid rule tree or duplicate name }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing segments write scope }
  /segments/parameters:
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    get:
      tags: [Segments]
      operationId: listSegmentParameters
      summary: Get grouped parameters with value types and list options
      security:
        - oauth2: ["segments:read"]
      responses:
        '200':
          description: Parameter catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        key: { type: string }
                        label: { type: string }
                        group: { type: string }
                        type: { type: string, enum: [list, number, date, boolean] }
                        options: { type: array, nullable: true, items: { type: string } }
                        money: { type: boolean }
                        hint: { type: string, nullable: true }
  /segments/{id}:
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, pattern: '^SG-\d+$' }
    get:
      tags: [Segments]
      operationId: getSegment
      summary: Get a segment definition
      security:
        - oauth2: ["segments:read"]
      responses:
        '200':
          description: Segment definition
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSegment' }
        '404': { description: Segment not found }
    patch:
      tags: [Segments]
      operationId: updateSegment
      summary: Replace a segment name and rule tree
      security:
        - oauth2: ["segments:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerSegmentWrite' }
      responses:
        '200':
          description: Updated segment
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerSegment' }
        '404': { description: Segment not found }
        '422': { description: Invalid rule tree or duplicate name }
  /customers:
    get:
      tags: [Customers]
      summary: List persisted customer profiles (never includes credentials)
      operationId: listCustomers
      description: |
        Returns `{items, total}`, initially populated from the server's CUSTOMER_OBJECTS constant.
        The customer list uses the UI API without a bearer token. The secured API requires customers:read.
      servers:
        - url: /crm/ui-api/v1
          description: CRM browser UI (prototype)
        - url: /crm/api/v1
          description: Secured server-to-server API
      security:
        - oauth2: ["customers:read"]
      responses:
        '200':
          description: Customer list
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Customer' }
  /customers/{id}:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, example: CU-1001 }
    get:
      tags: [Customers]
      summary: Get a customer profile
      operationId: getCustomer
      description: The UI API requires no bearer token; the secured API requires customers:read.
      servers:
        - url: /crm/ui-api/v1
          description: CRM browser UI (prototype)
        - url: /crm/api/v1
          description: Secured server-to-server API
      security:
        - oauth2: ["customers:read"]
      responses:
        '200':
          description: Customer profile without credentials
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { description: Customer not found }
    patch:
      tags: [Customers]
      summary: Update customer profile information
      operationId: updateCustomer
      description: The UI API requires no bearer token; the secured API requires customers:write.
      servers:
        - url: /crm/ui-api/v1
          description: CRM browser UI (prototype)
        - url: /crm/api/v1
          description: Secured server-to-server API
      security:
        - oauth2: ["customers:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CustomerUpdate' }
      responses:
        '200':
          description: Updated persisted customer
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Customer' }
        '404': { description: Customer not found }
        '422':
          description: Invalid, unknown, read-only or credential field
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /customers/{id}/credentials:
    parameters:
      - in: path
        name: id
        required: true
        schema: { type: string, example: CU-1001 }
    put:
      tags: [Customers]
      summary: Set a write-only customer password in the separate credential entity
      operationId: setCustomerPassword
      description: |
        Available only on the secured API, never the UI API. Uses a random 256-bit salt
        and PBKDF2-HMAC-SHA512 (210,000 iterations). No password, hash or salt is returned.
      security:
        - oauth2: ["customers:credentials"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [password]
              properties:
                password: { type: string, format: password, writeOnly: true, minLength: 12, maxLength: 256 }
      responses:
        '200':
          description: Credential updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated: { type: boolean }
        '401': { description: Missing or invalid bearer token }
        '403': { description: Missing customers credentials scope, or attempted use of UI API }
        '404': { description: Customer not found }
        '422': { description: Invalid password payload }
  /oauth/token:
    post:
      tags: [Authentication]
      summary: Obtain an access token (client credentials)
      description: Authenticate with HTTP Basic (`client_id:client_secret`, preferred) or with `client_id` / `client_secret` form fields.
      operationId: getToken
      security:
        - basicAuth: []
        - {}
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [grant_type]
              properties:
                grant_type: { type: string, enum: [client_credentials] }
                scope: { type: string, description: Space-separated scopes (defaults to all scopes of the client), example: "bonuses:read" }
                client_id: { type: string, description: Only when not using HTTP Basic }
                client_secret: { type: string, format: password, description: Only when not using HTTP Basic }
      responses:
        '200':
          description: Access token
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenResponse' }
        '400':
          description: invalid_request, unsupported_grant_type or invalid_scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '401':
          description: invalid_client
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
  /bonuses:
    post:
      tags: [Bonuses]
      summary: Create a bonus
      description: Creates a new bonus from its validated configuration.
      operationId: createBonus
      security:
        - oauth2: ["bonuses:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BonusCreate' }
      responses:
        '201':
          description: The created bonus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonusDetail' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
    get:
      tags: [Bonuses]
      summary: List bonuses
      description: Returns one page of bonuses plus per-filter counters. Different filter groups (`status`, `promo`, `bonusType`) are AND-ed; values inside one group are OR-ed. Use `offset` to implement "Show more".
      operationId: listBonuses
      security:
        - oauth2: ["bonuses:read"]
      parameters:
        - name: status
          in: query
          schema: { type: string, example: "active,auto" }
          description: Comma-separated statuses (`active`, `inactive`, `auto`). `active` includes auto-generated bonuses. Values are OR-ed.
        - name: promo
          in: query
          schema: { type: string, example: banner }
          description: Comma-separated promotion banner filters (`banner` = with, `nobanner` = without). Values are OR-ed.
        - name: bonusType
          in: query
          schema: { type: string, example: "free spins,cashback" }
          description: Comma-separated bonus types (`dep match`, `no-deposit`, `free spins`, `cashback`, `multiplier`). Values are OR-ed.
        - name: q
          in: query
          schema: { type: string }
          description: Case-insensitive search by bonus name or ID.
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
      responses:
        '200':
          description: A page of bonuses
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonusPage' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '400':
          description: Unknown filter value
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bonuses/{id}/delete:
    post:
      tags: [Bonuses]
      summary: Mark a bonus as deleted
      operationId: markBonusDeleted
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: BN-1001
      responses:
        '200':
          description: The updated bonus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bonus' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bonuses/{id}:
    get:
      tags: [Bonuses]
      summary: Get a bonus with all its settings
      operationId: getBonus
      security:
        - oauth2: ["bonuses:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: BN-1001
      responses:
        '200':
          description: The bonus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonusDetail' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    patch:
      tags: [Bonuses]
      summary: Update a bonus
      description: Partial update; nested objects are merged. Every change is recorded in the changelog.
      operationId: updateBonus
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: BN-1001
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BonusUpdate' }
      responses:
        '200':
          description: The updated bonus
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BonusDetail' }
        '400':
          description: Invalid JSON
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
  /bonuses/{id}/changelog:
    get:
      tags: [Bonuses]
      summary: Bonus changelog (newest first)
      operationId: getBonusChangelog
      security:
        - oauth2: ["bonuses:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: BN-1001
      responses:
        '200':
          description: Changelog entries
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/ChangelogEntry' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bonuses/{id}/promo-banner:
    get:
      tags: [Bonuses]
      summary: Get the promo banner shown on the casino site for a bonus
      operationId: getBonusPromoBanner
      security:
        - oauth2: ["bonuses:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Promo banner (empty defaults when not configured)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoBanner' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    put:
      tags: [Bonuses]
      summary: Replace the promo banner of a bonus
      operationId: updateBonusPromoBanner
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PromoBanner' }
      responses:
        '200':
          description: Saved promo banner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoBanner' }
        '422':
          description: Validation failed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bonuses/{id}/promo-codes:
    get:
      tags: [Bonuses]
      summary: List promo codes for a bonus
      operationId: listBonusPromoCodes
      security:
        - oauth2: ["bonuses:read"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Promo codes and their validity windows
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/PromoCode' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    post:
      tags: [Bonuses]
      summary: Generate a promo code for a bonus
      operationId: generateBonusPromoCode
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [startTime, endTime]
              properties:
                code: { type: string, example: "WELCOME100", description: "Optional, 4-32 chars A-Z 0-9 _ -; generated when omitted" }
                startTime: { type: string, example: "2026-09-01T00:00" }
                endTime: { type: string, example: "2026-12-31T23:59" }
      responses:
        '201':
          description: Generated promo code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PromoCode' }
        '422':
          description: Invalid validity window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
        '404':
          description: Bonus not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /bonuses/{id}/promo-codes/{code}:
    patch:
      tags: [Bonuses]
      summary: Change the text of a promo code
      operationId: updateBonusPromoCode
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, pattern: '^[A-Z0-9_-]{4,32}$' }
      responses:
        '200':
          description: Updated promo code
        '404':
          description: Bonus or promo code not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: Invalid or duplicate code
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
    delete:
      tags: [Bonuses]
      summary: Delete a promo code from a bonus
      operationId: deleteBonusPromoCode
      security:
        - oauth2: ["bonuses:write"]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
        - name: code
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Deleted promo code
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        '404':
          description: Bonus or promo code not found
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /games:
    get:
      tags: [Bonuses]
      summary: Game catalog that a bonus can be linked to
      operationId: listGames
      security:
        - oauth2: ["bonuses:read"]
      responses:
        '200':
          description: Games with their categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string, example: gates-of-olympus }
                        name: { type: string, example: Gates of Olympus }
                        category: { type: string, enum: [SLOTS, TABLE_GAMES, LIVE_CASINO, CRASH] }
  /exchange-rates:
    get:
      tags: [Exchange rates]
      summary: Exchange rates (units of currency per 1 EUR)
      operationId: getExchangeRates
      security:
        - oauth2: ["bonuses:read"]
      responses:
        '200':
          description: Current rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
    patch:
      tags: [Exchange rates]
      summary: Adjust exchange rates
      operationId: updateExchangeRates
      security:
        - oauth2: ["bonuses:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rates]
              properties:
                rates:
                  type: object
                  additionalProperties: { type: number, exclusiveMinimum: true, minimum: 0 }
                  example: { USD: 1.1 }
      responses:
        '200':
          description: Updated rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '422':
          description: Unknown currency or invalid rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
components:
  securitySchemes:
    oauth2:
      type: oauth2
      description: Client credentials flow; Swagger UI exchanges the credentials for a bearer token.
      flows:
        clientCredentials:
          tokenUrl: /crm/api/v1/oauth/token
          scopes:
            bonuses:read: List bonuses
            bonuses:write: Modify bonuses (mark as deleted)
            customers:read: Read customer profiles
            customers:write: Edit customer profiles
            customers:credentials: Set customer passwords (secured API only)
            segments:read: Read customer segments and parameter catalog
            segments:write: Create and edit customer segments
    basicAuth:
      type: http
      scheme: basic
      description: client_id and client_secret, used only at the token endpoint.
  schemas:
    CustomerSegmentWrite:
      type: object
      additionalProperties: false
      required: [name, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        rules: { $ref: '#/components/schemas/SegmentNode' }
    CustomerSegment:
      allOf:
        - $ref: '#/components/schemas/CustomerSegmentWrite'
        - type: object
          properties:
            id: { type: string, readOnly: true, example: SG-1001 }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
    SegmentNode:
      description: |
        At most 100 total nodes and 5 nested levels. List comparisons match any
        selected value. Money rules require a wallet currency; net cash flow
        additionally requires days (1-36500). Missing metrics do not match under NOT.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, operator, not, children]
          properties:
            kind: { type: string, enum: [group] }
            operator: { type: string, enum: [AND, OR] }
            not: { type: boolean }
            children: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SegmentNode' } }
        - type: object
          additionalProperties: false
          required: [kind, field, operator, not, value]
          properties:
            kind: { type: string, enum: [rule] }
            field: { type: string, description: Key from /segments/parameters }
            operator: { type: string, enum: [IS, '=', '!=', '<', '>', '>=', '<=', '=<'] }
            not: { type: boolean }
            value:
              oneOf:
                - { type: number }
                - { type: boolean }
                - { type: string, format: date }
                - { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            currency: { type: string, description: Required for money rules }
            days: { type: integer, minimum: 1, maximum: 36500, description: Required only for net_cash_flow }
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties: &CustomerProperties
        external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        DocumentINo: { type: string, maxLength: 200 }
        country: { type: string, enum: [CA, US, BR, MX, AR, CL, PE, DE, FR, ES, IT, NL, PL, SE, GB, IE, AT, FI, RU, KZ, UA, UZ, AZ, AE, SA, TR, EG, MA, NG, ZA, KE, GH, TH, VN, ID, PH, MY, IN, JP, KR, AU, NZ, BD] }
        currency: { type: string, enum: [EUR, USD, GBP, CAD, INR, BRL, MXN, TRY, AED, NGN, KES, ZAR, THB, VND, IDR, PHP, JPY, AUD, RUB, KZT, USDT, BTC] }
        lang: { type: string, enum: [en, de, sv, pl, pt, fr, hi, ar, th] }
        addr1: { type: string, maxLength: 200 }
        addr12: { type: string, maxLength: 200 }
        mfa_type: { type: string, enum: [NONE, TOTP, SMS, EMAIL] }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        kyc_status: { type: string, enum: [NOT_STARTED, PENDING, VERIFIED, REJECTED] }
        birthday: { type: string, format: date }
        aml_status: { type: string, enum: [CLEAR, REVIEW, BLOCKED] }
        funnel_status: { type: string, enum: [Lead, Registered, FTD, Trusted, VIP, Dormant] }
        gender: { type: string, enum: [Female, Male, Non-binary, Undisclosed] }
        info: { type: string, maxLength: 4000 }
    Customer:
      type: object
      additionalProperties: false
      properties:
        <<: *CustomerProperties
        id: { type: string, readOnly: true, example: CU-1001 }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        devices: { type: array, readOnly: true, items: { type: string, enum: [Desktop, Mobile, Tablet] } }
        sessions_per_week: { type: number, readOnly: true, description: Demo session frequency; not live analytics }
        bonus_wr_rate: { type: number, minimum: 0, maximum: 100, readOnly: true, description: Demo wagering completion percentage }
        activity:
          type: object
          readOnly: true
          description: Seeded demo activity; last session is a duration, not a timestamp.
          required: [last_login_at, last_session_hours, overall_game_hours]
          properties:
            last_login_at: { type: string, format: date-time, nullable: true }
            last_session_hours: { type: number, minimum: 0, example: 3 }
            overall_game_hours: { type: number, minimum: 0, example: 5000 }
        risk_indicators:
          type: array
          readOnly: true
          description: Seeded demo review signals, not verified risk findings.
          uniqueItems: true
          items:
            type: string
            enum: [rdw, multiple_payment_methods, pof_pow_violations, abnormal_activity, bonus_abuse, bot_activity, device_fingerprint_mismatches, failed_kyc_attempts, vpn_multiple_ips]
    Bonus:
      type: object
      required: [id, name, status, bonusType, hasPromo, createdAt, dateStart, dateEnd, event, bonusValue, wagered, wins, received, groups, deleted]
      properties:
        id: { type: string, example: BN-1001 }
        name: { type: string, example: Welcome Pack 100% }
        status: { type: string, enum: [active, inactive, auto] }
        bonusType: { type: string, enum: [dep match, no-deposit, free spins, cashback, multiplier] }
        hasPromo: { type: boolean }
        createdAt: { type: string, format: date }
        dateStart: { type: string, format: date }
        dateEnd: { type: string, format: date }
        event: { type: string, description: Event that gives the bonus, example: First deposit }
        bonusValue: { type: integer, description: Bonus value in EUR, example: 120000 }
        wagered: { type: integer, description: Total wagered in EUR, example: 96400 }
        wins: { type: integer, description: Total wins in EUR, example: 81200 }
        received: { type: integer, description: Number of players who received the bonus, example: 2140 }
        groups:
          type: array
          description: Segments (player groups) the bonus is available to
          items: { type: string }
          example: [first_dep, registered]
        deleted: { type: boolean }
    BonusPage:
      type: object
      required: [items, total, offset, limit, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bonus' }
        total: { type: integer, description: Number of bonuses matching all filters and search }
        offset: { type: integer }
        limit: { type: integer }
        counts:
          type: object
          description: Facet counters. Each option is counted with the other groups' selections and the search applied, but not its own group's.
          required: [total, status, promo, bonusType]
          properties:
            total: { type: integer }
            status: { type: object, additionalProperties: { type: integer }, example: { active: 73, inactive: 27, auto: 36 } }
            promo: { type: object, additionalProperties: { type: integer }, example: { banner: 49, nobanner: 51 } }
            bonusType: { type: object, additionalProperties: { type: integer }, example: { dep match: 31, no-deposit: 1, free spins: 30, cashback: 8, multiplier: 30 } }
    Availability:
      type: object
      properties:
        startTime: { type: string, example: "2026-09-01T00:00", description: "YYYY-MM-DDTHH:MM" }
        endTime: { type: string, example: "2026-12-31T23:59", description: "Must be after startTime" }
        includeSegments:
          type: array
          description: "Customer segment names from GET /segments, or legacy registered, no_deposit, kyc_verified. Existing selections remain valid if a segment is renamed."
          items: { type: string }
        excludeSegments:
          type: array
          description: "Customer segment names from GET /segments, or legacy restricted_countries, restricted_currencies. Existing selections remain valid if a segment is renamed."
          items: { type: string }
    Triggers:
      type: object
      properties:
        event: { type: string, enum: [on_registration, on_deposit] }
        minDeposit: { type: number, description: EUR }
        maxDeposit: { type: number, description: "EUR, must be >= minDeposit" }
        depositNumber: { type: integer, minimum: 0 }
        minDepositCount: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: "Player must have made at least this many deposits. Empty means no minimum." }
        maxDepositCount: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: "Player must have made at most this many deposits, must be >= minDepositCount. Empty means no maximum." }
    Games:
      type: object
      description: Games the bonus can be played on.
      properties:
        linkType: { type: string, enum: [categories, game], description: "categories - one or more game categories (empty list means all games); game - a single game" }
        categories:
          type: array
          items: { type: string, enum: [SLOTS, TABLE_GAMES, LIVE_CASINO, CRASH] }
        game: { type: string, nullable: true, description: "Game id from GET /games, required when linkType is game", example: gates-of-olympus }
    Reward:
      type: object
      properties:
        mode: { type: string, enum: [BONUS_MONEY, FREE_SPINS], description: "FREE_SPINS uses freeSpins; BONUS_MONEY uses dmp and maxBonusAmount" }
        freeSpins:
          type: object
          description: "Distribution example: 100 spins at 20 spins per day are given over 5 days"
          properties:
            quantity: { type: integer, minimum: 1, maximum: 10000, example: 100 }
            spinsPerDay: { type: integer, minimum: 1, description: "Must not exceed quantity; days = ceil(quantity / spinsPerDay)", example: 20 }
        dmp: { type: number, description: "Deposit match percentage. When 0, the bonus amount equals maxBonusAmount; otherwise min(deposit * dmp / 100, maxBonusAmount)", example: 50 }
        maxBonusAmount: { type: number, description: "EUR" }
    Wagering:
      type: object
      properties:
        multiplier: { type: number, example: 35 }
        timeToCompleteDays: { type: integer, example: 14 }
        maxBetPerRound: { type: number, description: EUR }
        appliesTo: { type: string, enum: [BONUS_ONLY, BONUS_PLUS_DEPOSIT, WINNINGS_ONLY] }
        maxWithdrawCap:
          type: object
          properties:
            type: { type: string, enum: [MULTIPLIER, FIXED] }
            value: { type: number, description: "EUR when FIXED, a multiplier otherwise" }
    WalletRules:
      type: object
      properties:
        deduction: { type: string, enum: [MAIN_WALLET_FIRST, BONUS_MONEY_FIRST] }
        winnings: { type: string, enum: [MAIN_WALLET_FIRST, BONUS_MONEY_FIRST] }
        allowCancelBeforeWagering: { type: boolean }
        allowWithdrawBeforeWagering: { type: boolean }
    AntiBonusHunter:
      type: object
      properties:
        maxClaimsPerIp: { type: integer, minimum: 0, maximum: 1000 }
        maxClaimsPerDevice: { type: integer, minimum: 0, maximum: 1000 }
        blockSharedIpSubnets: { type: boolean }
        blockKnownVpnsAndProxies: { type: boolean }
        paymentMethodBlacklist:
          type: array
          items: { type: string, enum: [SKRILL, NETELLER, CRYPTO] }
        requireKycLevelBeforeClaim: { type: string, enum: [NONE, VERIFIED_EMAIL, VERIFIED_ID, VERIFIED_ID_AND_ADDRESS] }
        maxBetPerRound: { type: number, description: EUR }
        maxBetPercentageOfBonus: { type: number, minimum: 0, maximum: 100 }
        restrictZeroRiskBetting: { type: boolean }
        minEvenMoneyCoveragePercentage: { type: number, minimum: 0, maximum: 100, description: "Shown as Anti-hedging threshold. Applies to Roulette/Baccarat: stops betting on 50/50 outcomes" }
    PromoBanner:
      type: object
      description: Banner shown on the casino web site. Target segments are the bonus include segments.
      properties:
        images:
          type: object
          description: Data URLs (png, jpeg, webp, gif; max about 2 MB each) or null
          properties:
            web: { type: string, nullable: true }
            tablet: { type: string, nullable: true }
            mobile: { type: string, nullable: true }
        title: { type: string, description: HTML, maxLength: 20000 }
        description: { type: string, description: HTML, maxLength: 20000 }
        buttons:
          type: object
          properties:
            depositForSignedUsers: { type: boolean }
            signUpForAnonymous: { type: boolean }
        pages:
          type: object
          properties:
            home: { type: boolean }
            welcome: { type: boolean }
    PromoCode:
      type: object
      properties:
        code: { type: string, example: PROMO-7H3K9P2Q }
        startTime: { type: string, example: "2026-09-01T00:00" }
        endTime: { type: string, example: "2026-12-31T23:59" }
        createdAt: { type: string, format: date-time }
    BonusUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, inactive] }
        bonusType: { type: string, enum: [dep match, no-deposit, free spins, cashback, multiplier] }
        category: { type: string, enum: [SLOTS, TABLE_GAMES, LIVE_CASINO, CRASH] }
        availability: { $ref: '#/components/schemas/Availability' }
        triggers: { $ref: '#/components/schemas/Triggers' }
        games: { $ref: '#/components/schemas/Games' }
        reward: { $ref: '#/components/schemas/Reward' }
        wagering: { $ref: '#/components/schemas/Wagering' }
        walletRules: { $ref: '#/components/schemas/WalletRules' }
        antiBonusHunter: { $ref: '#/components/schemas/AntiBonusHunter' }
    BonusCreate:
      allOf:
        - $ref: '#/components/schemas/BonusUpdate'
        - type: object
          required: [name, description, status, bonusType, category, availability, triggers, reward, wagering, walletRules, antiBonusHunter]
    BonusDetail:
      allOf:
        - $ref: '#/components/schemas/Bonus'
        - $ref: '#/components/schemas/BonusUpdate'
        - type: object
          properties:
            createdBy: { type: string, example: v.kovalevskiy }
    ChangelogEntry:
      type: object
      properties:
        at: { type: string, format: date-time }
        by: { type: string }
        summary: { type: string }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: reward.dmp }
              from: {}
              to: {}
    ExchangeRates:
      type: object
      properties:
        base: { type: string, example: EUR }
        rates: { type: object, additionalProperties: { type: number }, example: { USD: 1.08, GBP: 0.85 } }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: Validation failed }
        fields:
          type: object
          additionalProperties: { type: string }
          example: { "reward.dmp": "Must be a number between 0 and 1000" }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, description: "Signed JWT (HS256) with claims iss, sub, aud, iat, nbf, exp, jti, scope" }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        scope: { type: string, example: "bonuses:read bonuses:write" }
    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_token }
        error_description: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
