openapi: 3.0.3
info:
  title: NextLuck CRM API
  version: 1.1.0
  description: |
    REST API behind the CRM Bonuses (`/crm/b/`) and Customers (`/crm/c/list/`) pages.

    ## Localization
    Send `Accept-Language: en`, `ru`, `pt-PT`, `pt-BR` or `es` to select human-readable
    error messages. Bare `pt` defaults to Portugal; `es-ES` selects Spanish for Spain.
    English is the default for unsupported or omitted languages. Responses include
    `Content-Language`. JSON field names, protocol codes, casino ownership and
    successful business records remain unchanged.

    ## Casino ownership
    Operational endpoints require `X-Casino-Id: CS-...`. Missing or malformed context returns
    400, an unpermitted casino returns 403, and a foreign detail or nested object returns 404.
    Ownership is server assigned and immutable; request bodies containing `casino_id` return 422.
    Lists, search, facets, nested resources and mutations share the same tenant store.
    The casino registry, OAuth and `/reporting/*` endpoints are explicitly global.
    Reporting is read-only and uses separate reporting permissions, never the operational header.

    Browser routes default to visibly labeled demo-only operation. Production operators must
    use `CRM_UI_MODE=authenticated` with configured credentials, HTTPS and casino permission
    lists. OAuth alone does not authenticate the browser UI.

    ## Server-to-server authentication
    OAuth 2.0 **client credentials** grant (RFC 6749 §4.4). The calling server exchanges its `client_id` / `client_secret`
    at `POST /oauth/token` for a short-lived (15 min) signed JWT access token and sends it as `Authorization: Bearer <token>`.

    * Keep the client secret on the server only (env var / secret manager); never ship it to browsers or mobile apps.
    * Request the least-privilege scopes you need (`bonuses:read`, `bonuses:write`).
    * Cache the token until shortly before `expires_in`, then request a new one. There are no refresh tokens.
    * Always use HTTPS; token responses are `Cache-Control: no-store`.
    * Failures follow RFC 6749 / RFC 6750: `401` + `WWW-Authenticate` for missing/invalid credentials, `403` for insufficient scope.
servers:
  - url: /crm/api/v1
tags:
  - name: Authentication
  - name: Bonuses
  - name: Exchange rates
  - name: Customers
  - name: Segments
  - name: Games
  - name: Casinos
  - name: Finance
  - name: Reporting
  - name: Dashboard
  - name: Compliance
  - name: Loyalty
paths:
  /customers/{customerId}/activity:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - name: customerId
        in: path
        required: true
        schema: { type: string, pattern: '^CU-[0-9]+$' }
    get:
      tags: [Customers]
      operationId: getCustomerActivity
      summary: Read customer activity newest first, filtered by UTC dates and event tag
      description: |
        Requires customers:read and the owning casino context. Demo mode creates one saved
        fictional timeline per customer without overwriting existing histories.
        No automatic operational-event ingestion is connected; authenticated mode never seeds
        demo histories. Dates include both UTC boundary days. Stable ordering uses created_at
        descending then ID descending. Filters apply before pagination.
      security: [{ oauth2: ["customers:read"] }]
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date }
        - name: to
          in: query
          schema: { type: string, format: date }
        - name: tag
          in: query
          schema: { type: string, enum: [customer, game, finance, loyalty, bonus, compliance, segment] }
        - name: offset
          in: query
          schema: { type: integer, minimum: 0, maximum: 99999999, default: 0 }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 10 }
      responses:
        '200':
          description: Customer activity page
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/CustomerActivityEvent' } }
                  total: { type: integer }
                  offset: { type: integer }
                  limit: { type: integer }
                  tags: { type: array, items: { type: string } }
                  demo: { type: boolean }
        '404': { description: Customer does not belong to this casino }
        '422': { description: Invalid filter, reversed dates or invalid pagination }
  /loyalty:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Loyalty]
      operationId: getLoyalty
      summary: Read casino-owned tiers and available reward bonus names
      security: [{ oauth2: ["loyalty:read"] }]
      responses:
        '200':
          description: Tiers sorted by ascending LP threshold; bonus options exclude deleted bonuses
          content:
            application/json:
              schema:
                type: object
                properties:
                  tiers: { type: array, items: { $ref: '#/components/schemas/LoyaltyTier' } }
                  bonus_options:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
  /loyalty/tiers:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    post:
      tags: [Loyalty]
      operationId: createLoyaltyTier
      summary: Add a tier (configuration only; no automatic accrual or reward issuance)
      security: [{ oauth2: ["loyalty:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/LoyaltyTierInput'
                - required: [name, minimum_points, game_weight, eur_per_point, segment_ids, bonus_ids, cashback, rakeback]
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyTier' }
        '422': { description: Invalid fields, duplicate tier name/threshold or foreign selections }
  /loyalty/tiers/{tierId}:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - name: tierId
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Loyalty]
      operationId: updateLoyaltyTier
      summary: Edit tier settings without changing saved customer LP
      security: [{ oauth2: ["loyalty:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoyaltyTierInput' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LoyaltyTier' }
        '404': { description: Tier does not belong to this casino }
        '422': { description: Validation failed }
    delete:
      tags: [Loyalty]
      operationId: deleteLoyaltyTier
      summary: Remove a tier while retaining customer points
      security: [{ oauth2: ["loyalty:write"] }]
      responses:
        '200':
          description: Removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted: { type: string }
        '404': { description: Tier does not belong to this casino }
  /games/ranking:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Games]
      operationId: getDemoGameRanking
      summary: Casino-scoped synthetic geo or personal ranking (demo mode only)
      description: |
        Requires games:read. Returns 503 outside CRM_UI_MODE=demo.
        No real bet-volume or player-history feed is connected. Order is deterministic
        per casino/country/demo identity, and all returned IDs belong to enabled games.
      parameters:
        - {name: country, in: query, schema: {type: string, default: WORLD}}
        - {name: mode, in: query, schema: {type: string, enum: [geo, personal], default: geo}}
        - {name: minutes, in: query, schema: {type: integer, minimum: 1, maximum: 525600, default: 60}}
        - {name: player, in: query, schema: {type: string, pattern: '^demo-[a-zA-Z0-9-]{1,80}$'}}
      responses:
        '200':
          description: Ordered game IDs and explicit ranking metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: {type: array, items: {type: object, properties: {gameId: {type: string}}}}
                  total: {type: integer}
                  metric: {type: string, enum: [bet_volume]}
                  country: {type: string}
                  countryName: {type: string, nullable: true}
                  period: {type: object, properties: {minutes: {type: integer}, live: {type: boolean}}}
                  updatedAt: {type: string, format: date-time}
                  personalized: {type: boolean}
                  demo: {type: boolean, enum: [true]}
        '422': {description: Invalid country, demo identity or ranking parameters}
        '503': {description: Demo rankings disabled}
  /games/demo-favourites:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - {name: player, in: query, required: true, schema: {type: string, pattern: '^demo-[a-zA-Z0-9-]{1,80}$'}}
    get:
      tags: [Games]
      summary: Read casino-local favourites for an explicit demo identity
      description: Demo mode only. Requires games:read. Not a real player-authentication endpoint.
      responses:
        '200': {description: 'items of gameId, total and demo=true'}
        '422': {description: Invalid or missing demo identity}
        '503': {description: Demo endpoints disabled}
    post:
      tags: [Games]
      summary: Set or remove a casino-local demo favourite
      description: Demo mode only. Requires games:write. Persists in the atomic casino tenant snapshot.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [gameId, favourite]
              properties:
                gameId: {type: string}
                favourite: {type: boolean}
      responses:
        '200': {description: Updated gameId list}
        '422': {description: Invalid body or game does not belong to this casino or is disabled}
        '503': {description: Demo endpoints disabled}
  /compliance:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Compliance]
      operationId: getCompliance
      summary: Get casino-owned compliance review queues
      description: |
        Also available under /crm/ui-api/v1 with the existing operator authentication policy.
        Only in CRM_UI_MODE=demo, the first authorized GET lazily creates 15 synthetic payout
        reviews, 20 KYC requests and 30 alerts in New status, plus three payout and KYC
        examples per Pending/Approved/Declined state (24/29 total). Existing demo stores
        receive extra examples once without overwriting review decisions.
        If necessary, it creates demo profiles
        without credentials or a financial ledger. Registry, dashboard and segment reads do
        not seed these fixtures. Seeds persist across restarts and are never duplicated.
        Synthetic document previews use only /coml/demo-document.svg. No uploads, real
        payouts or customer messages are performed. Request bodies are limited to 64 KiB.
      security: [{ oauth2: ["compliance:read"] }]
      responses:
        '200':
          description: Review queues and segment risk scores
          content:
            application/json:
              schema:
                type: object
                required: [payouts, kyc_requests, alerts, risk_matrix, demo]
                properties:
                  demo: { type: boolean }
                  payouts: { type: array, items: { $ref: '#/components/schemas/CompliancePayout' } }
                  kyc_requests: { type: array, items: { $ref: '#/components/schemas/ComplianceKyc' } }
                  alerts: { type: array, items: { $ref: '#/components/schemas/ComplianceAlert' } }
                  risk_matrix: { type: array, items: { $ref: '#/components/schemas/ComplianceRiskEntry' } }
        '400': { description: Missing or malformed casino context }
        '401': { description: Authentication required }
        '403': { description: Casino or scope not permitted }
  /compliance/risk-matrix:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Compliance]
      operationId: getComplianceRiskMatrix
      summary: Read configured casino-local segment risk scores
      security: [{ oauth2: ["compliance:read"] }]
      responses:
        '200':
          description: Matrix entries; segment list and detail DTOs expose risk_score (default 0)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceRiskMatrix' }
    patch:
      tags: [Compliance]
      operationId: replaceComplianceRiskMatrix
      summary: Atomically replace all configured matrix entries
      security: [{ oauth2: ["compliance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ComplianceRiskMatrix' }
      responses:
        '200':
          description: Persisted entries
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceRiskMatrix' }
        '422': { description: Duplicate or foreign segment IDs, invalid scores, or unknown fields }
  /compliance/kyc-requests:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    post:
      tags: [Compliance]
      operationId: createComplianceKycRequest
      summary: Create a KYC review request, without uploading a document
      description: |
        Sets the customer profile KYC status to PENDING. The new request is New with
        preview_url null; a document name is not proof that any document was uploaded.
      security: [{ oauth2: ["compliance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [customer_id, document_name]
              properties:
                customer_id: { type: string, pattern: '^CU-[0-9]+$' }
                document_name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        '201':
          description: Persisted request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceKyc' }
        '404': { description: Customer does not belong to the selected casino }
        '422': { description: Invalid document name or read-only fields }
  /compliance/{collection}/{id}:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: collection
        required: true
        schema: { type: string, enum: [payouts, kyc-requests, alerts] }
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Compliance]
      operationId: updateComplianceStatus
      summary: Review a record; never execute a payout
      description: |
        New can become Pending, Approved or Declined; Pending can become Approved or
        Declined. Terminal decisions cannot be reversed. Repeating the current status is
        idempotent. Audit metadata records the actor, time and old/new statuses.
        For the latest KYC request of a customer only, Pending/Approved/Declined update
        the profile to PENDING/VERIFIED/REJECTED respectively. Older requests do not
        overwrite the latest request's result. Initial demo rows preserve profile statuses.
      security: [{ oauth2: ["compliance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [status]
              properties:
                status: { $ref: '#/components/schemas/ComplianceStatus' }
      responses:
        '200':
          description: Updated review record
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/CompliancePayout'
                  - $ref: '#/components/schemas/ComplianceKyc'
                  - $ref: '#/components/schemas/ComplianceAlert'
        '404': { description: Record or customer does not belong to the selected casino }
        '409': { description: Status transition is not allowed }
        '422': { description: Invalid status or read-only fields }
  /compliance/customers/{customer_id}/block:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: customer_id
        required: true
        schema: { type: string, pattern: '^CU-\d+$' }
    post:
      tags: [Compliance]
      summary: Persist an internal customer block flag (no external enforcement)
      description: |
        Sets compliance_blocked, compliance_blocked_at and compliance_blocked_by on
        the casino-owned customer. Idempotent. Does not change AML status or execute
        restrictions in external login, gaming or payment services.
      security: [{ oauth2: ["compliance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, maxProperties: 0 }
      responses:
        '200':
          description: Updated customer with internal blocking metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  id: { type: string }
                  compliance_blocked: { type: boolean, enum: [true] }
                  compliance_blocked_at: { type: string, format: date-time }
                  compliance_blocked_by: { type: string }
        '404':
          description: Customer not found in this casino
        '422':
          description: Unknown request fields
  /compliance/customers/{customer_id}/chat:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: customer_id
        required: true
        schema: { type: string, pattern: '^CU-[0-9]+$' }
    get:
      tags: [Compliance]
      operationId: getComplianceInternalNotes
      summary: Read staff-only internal notes (no external delivery)
      security: [{ oauth2: ["compliance:read"] }]
      responses:
        '200':
          description: Internal notes in creation order
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceNotes' }
        '404': { description: Customer does not belong to the selected casino }
    post:
      tags: [Compliance]
      operationId: createComplianceInternalNote
      summary: Save a staff-only internal note; never send a customer message
      security: [{ oauth2: ["compliance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [message]
              properties:
                message: { type: string, minLength: 1, maxLength: 4000 }
      responses:
        '201':
          description: All persisted internal notes, including the new note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ComplianceNotes' }
        '404': { description: Customer does not belong to the selected casino }
        '409': { description: Maximum 1000 notes per customer reached }
        '422': { description: Invalid message or read-only fields }
  /dashboard:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Dashboard]
      operationId: getCasinoHomeDashboard
      summary: Get persisted casino-specific demo summary cards for CRM Home
      description: |
        Seeded summaries are synthetic samples, not derived operational balances or reports.
        Every casino has an independent stable snapshot. No customers, payments or history
        are created by this seed. The My Casinos card reflects the permitted global registry.
        Analytics reports remain independently filtered despite the context-specific Home teaser.
      security: [{ oauth2: ["dashboard:read"] }]
      responses:
        '200':
          description: Casino-specific demo snapshot plus actual global registry card
          content:
            application/json:
              schema:
                type: object
                required: [casino_id, source, version, sections]
                properties:
                  casino_id: { type: string, readOnly: true }
                  source: { type: string, enum: [synthetic_demo] }
                  version: { type: integer }
                  sections:
                    type: object
                    additionalProperties:
                      type: object
                      required: [value, label, metrics]
                      properties:
                        value: { type: string }
                        label: { type: string }
                        metrics:
                          type: array
                          minItems: 4
                          maxItems: 4
                          items:
                            type: object
                            required: [label, value, tone]
                            properties:
                              label: { type: string }
                              value: { type: string }
                              tone: { type: string, enum: ['', up, down] }
        '400': { description: Missing or malformed X-Casino-Id }
        '403': { description: Casino or dashboard read scope not permitted }
        '405': { description: Dashboard is read-only }
  /casinos:
    servers:
      - url: /crm/ui-api/v1
        description: CRM browser UI prototype (no bearer token)
      - url: /crm/api/v1
        description: Secured server-to-server API
    get:
      tags: [Casinos]
      operationId: listCasinoWebsites
      summary: List persisted casino website configurations
      security: [{ oauth2: ["casinos:read"] }]
      responses:
        '200':
          description: Website configurations, not live availability
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  total: { type: integer }
                  items: { type: array, items: { $ref: '#/components/schemas/CasinoWebsite' } }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing casinos read scope }
    post:
      tags: [Casinos]
      operationId: createCasinoWebsite
      summary: Save a website configuration (does not deploy a website)
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema: { type: string, minLength: 8, maxLength: 200 }
      security: [{ oauth2: ["casinos:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - { $ref: '#/components/schemas/CasinoWebsiteWrite' }
                - { required: [name, url, theme] }
      responses:
        '201':
          description: Persisted website
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CasinoWebsite' }
        '422': { description: Validation failed with field errors }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing casinos write scope }
        '400': { description: Missing or invalid Idempotency-Key }
        '409': { description: Source revision changed, or key reused with a different request }
  /casinos/clone-preview:
    post:
      tags: [Casinos]
      operationId: previewCasinoConfigurationCopy
      summary: Resolve configuration group dependencies and counts without creating a casino
      security: [{ oauth2: ["casinos:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [source_id, groups]
              properties:
                source_id: { type: string, pattern: '^CS-[a-f0-9]{16}$' }
                groups: { $ref: '#/components/schemas/CopyGroups' }
      responses:
        '200':
          description: Source revision, requested/dependency groups and per-type counts; no credentials or history
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ClonePreview' }
        '403': { description: Source or scope not permitted }
        '422': { description: Invalid groups or unsupported dependencies }
  /context-events:
    post:
      tags: [Casinos]
      operationId: recordContextChange
      summary: Record a platform preference event without changing business objects
      security: [{ oauth2: ["casinos:read"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [to]
              properties:
                from: { type: string, nullable: true }
                to: { type: string }
      responses:
        '200': { description: Preference event recorded }
        '403': { description: Context not permitted }
  /finance:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Finance]
      operationId: getCasinoFinance
      summary: Casino-owned connections, gateways, cascades and financial records
      security: [{ oauth2: ["finance:read"] }]
      responses:
        '200':
          description: Finance data; histories exist only where originally owned, never globally reseeded
          content:
            application/json:
              schema:
                type: object
                required: [connections, gateways, cascades, wallets, wallet_transactions, transactions, players, game_catalog]
                additionalProperties: { type: array, items: { type: object } }
        '400': { description: Missing or malformed X-Casino-Id }
        '403': { description: Casino or scope not permitted }
  /finance/{resource}:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: resource
        required: true
        schema: { type: string, enum: [connections, cascades] }
    post:
      tags: [Finance]
      operationId: createCasinoFinanceConfiguration
      summary: Create an owner-validated connection or cascade
      security: [{ oauth2: ["finance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Persisted configuration }
        '400': { description: Missing or malformed context }
        '403': { description: Casino or scope not permitted }
        '422': { description: Validation failed; secrets required before enabling cloned connections }
  /finance/{resource}/{id}:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: resource
        required: true
        schema: { type: string, enum: [connections, cascades] }
      - in: path
        name: id
        required: true
        schema: { type: string }
    patch:
      tags: [Finance]
      operationId: updateCasinoFinanceConfiguration
      security: [{ oauth2: ["finance:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Updated configuration }
        '404': { description: Owner-local object not found }
        '422': { description: Invalid configuration or foreign reference }
    delete:
      tags: [Finance]
      operationId: deleteCasinoFinanceConfiguration
      security: [{ oauth2: ["finance:write"] }]
      responses:
        '200': { description: Deleted configuration }
        '404': { description: Owner-local object not found }
        '422': { description: Connection is still referenced by a cascade }
  /catalogs:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Games]
      operationId: getCasinoCatalogs
      summary: Owner-local providers, categories, currencies, countries and languages
      security: [{ oauth2: ["games:read"] }]
      responses:
        '200': { description: Independent casino catalogs }
        '400': { description: Missing or malformed context }
        '403': { description: Casino or read scope not permitted }
  /reporting/segments:
    get:
      tags: [Reporting]
      operationId: getReportingSegments
      summary: Read-only reporting segments independent of operational context
      description: |
        Object IDs are qualified as casino_id:object_id. Rows include object_id, casino_id,
        casino_name, original_name and a disambiguated name. Related IDs are qualified too.
        The synthetic Analytics website dimension remains explicitly synthetic and independent.
      security: [{ oauth2: ["segments:read"] }]
      responses: &ReportingResponses
        '200': { description: Reporting-permitted owner-qualified dimensions }
        '403': { description: Reporting permissions or corresponding resource read scope required }
        '405': { description: Reporting does not accept mutations; choose an explicit operational owner }
  /reporting/segments/parameters:
    get:
      tags: [Reporting]
      operationId: getReportingSegmentParameters
      summary: Immutable reporting parameter schema, not operational catalog configuration
      security: [{ oauth2: ["segments:read"] }]
      responses:
        '200': { description: Parameter type, operator and protocol metadata }
        '403': { description: Segments read scope required }
  /reporting/games:
    get:
      tags: [Reporting]
      operationId: getReportingGames
      summary: Reporting-permitted games with qualified owner and reference identities
      security: [{ oauth2: ["games:read"] }]
      responses: *ReportingResponses
  /reporting/games/categories:
    get:
      tags: [Reporting]
      operationId: getReportingCategories
      summary: Reporting-permitted categories with owner-qualified game references
      security: [{ oauth2: ["games:read"] }]
      responses: *ReportingResponses
  /reporting/games/publishers:
    get:
      tags: [Reporting]
      operationId: getReportingProviders
      summary: Reporting-permitted providers with owner-qualified identities
      security: [{ oauth2: ["games:read"] }]
      responses: *ReportingResponses
  /casinos/{id}:
