      responses:
        '200':
          description: Full catalog. Filter and publisher grouping are performed by the CRM UI.
          content:
            application/json:
              schema:
                type: object
                properties:
                  total: { type: integer }
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/CatalogGame' }
        '401': { description: Missing or invalid token on secured API }
        '403': { description: Missing games read or legacy bonuses read scope }
  /games/{id}:
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: id
        required: true
        schema: { type: string }
    get:
      tags: [Games]
      operationId: getCatalogGame
      summary: Get a game
      security: [{ oauth2: ["games:read"] }]
      responses:
        '200':
          description: Game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogGame' }
        '404': { description: Game not found }
        '401': { description: Missing or invalid token }
        '403': { description: Missing games read scope }
    patch:
      tags: [Games]
      operationId: updateCatalogGame
      summary: Edit game properties or toggle enabled status
      security: [{ oauth2: ["games:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CatalogGameWrite' }
      responses:
        '200':
          description: Saved game
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CatalogGame' }
        '404': { description: Game not found }
        '422': { description: Invalid values or read-only fields }
        '401': { description: Missing or invalid token }
        '403': { description: Missing games write scope }
  /games/publishers:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    get:
      tags: [Games]
      operationId: listGamePublishers
      summary: List publishers and local demo logo marks
      security: [{ oauth2: ["games:read"] }]
      responses:
        '200':
          description: Publishers
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: string }
                        name: { type: string }
                        mark: { type: string }
                        color: { type: string }
                        logo: { type: string, description: Local SVG mark path, not an official publisher logo }
  /games/categories:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    get:
      tags: [Games]
      operationId: listGameCategories
      summary: List game categories
      security: [{ oauth2: ["games:read"] }]
      responses:
        '200':
          description: Categories
          content:
            application/json:
              schema:
                type: object
                properties:
                  items: { type: array, items: { $ref: '#/components/schemas/GameCategory' } }
    post:
      tags: [Games]
      operationId: createGameCategory
      summary: Create a category with unique name and CMS identifier
      security: [{ oauth2: ["games:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameCategoryWrite' }
      responses:
        '201':
          description: Saved category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameCategory' }
        '422': { description: Invalid fields or duplicate name/CMS identifier }
  /games/categories/{categoryId}:
    servers:
      - url: /crm/ui-api/v1
      - url: /crm/api/v1
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
      - in: path
        name: categoryId
        required: true
        schema: { type: string }
    patch:
      tags: [Games]
      operationId: updateGameCategory
      summary: Update category properties, game membership or game order
      security: [{ oauth2: ["games:write"] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GameCategoryWrite' }
      responses:
        '200':
          description: Saved category
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GameCategory' }
        '404': { description: Category not found }
        '422': { description: Invalid fields or duplicate name/CMS identifier }
  /exchange-rates:
    parameters:
      - $ref: '#/components/parameters/CasinoContext'
    get:
      tags: [Exchange rates]
      summary: Exchange rates (units of currency per 1 EUR)
      operationId: getExchangeRates
      security:
        - oauth2: ["bonuses:read"]
      responses:
        '200':
          description: Current rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
    patch:
      tags: [Exchange rates]
      summary: Adjust exchange rates
      operationId: updateExchangeRates
      security:
        - oauth2: ["bonuses:write"]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [rates]
              properties:
                rates:
                  type: object
                  additionalProperties: { type: number, exclusiveMinimum: true, minimum: 0 }
                  example: { USD: 1.1 }
      responses:
        '200':
          description: Updated rates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ExchangeRates' }
        '401':
          description: Missing, invalid or expired access token
          headers:
            WWW-Authenticate: { schema: { type: string } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '403':
          description: Token lacks the required scope
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OAuthError' }
        '422':
          description: Unknown currency or invalid rate
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationError' }
components:
  parameters:
    CasinoContext:
      in: header
      name: X-Casino-Id
      required: true
      description: Immutable owning casino. 400 if missing/malformed; 403 if not permitted; foreign objects are 404.
      schema: { type: string, pattern: '^CS-[a-f0-9]{16}$' }
  securitySchemes:
    oauth2:
      type: oauth2
      description: Client credentials flow; Swagger UI exchanges the credentials for a bearer token.
      flows:
        clientCredentials:
          tokenUrl: /crm/api/v1/oauth/token
          scopes:
            bonuses:read: List bonuses
            bonuses:write: Modify bonuses (mark as deleted)
            customers:read: Read customer profiles
            customers:write: Edit customer profiles
            customers:credentials: Set customer passwords (secured API only)
            segments:read: Read customer segments and parameter catalog
            segments:write: Create and edit customer segments
            games:read: Read game catalog, publishers and categories
            games:write: Edit games and manage game categories
            casinos:read: Read casino website configurations
            casinos:write: Create and edit casino website configurations
            finance:read: Read casino-owned payment configuration and financial records
            finance:write: Manage casino-owned payment connections and cascades
            dashboard:read: Read casino-specific CRM Home sample summaries
            compliance:read: Read casino-owned compliance reviews and internal notes
            compliance:write: Review compliance records, configure risk scores and write internal notes
            loyalty:read: Read casino loyalty tier settings and bonus selection options
            loyalty:write: Add, edit and remove casino loyalty tiers
    basicAuth:
      type: http
      scheme: basic
      description: client_id and client_secret, used only at the token endpoint.
  schemas:
    CustomerActivityEvent:
      type: object
      required: [id, casino_id, customer_id, created_at, user_name, event_type, event_tag, session_id, details, demo]
      properties:
        id: { type: string, readOnly: true }
        casino_id: { type: string, readOnly: true }
        customer_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time }
        user_name: { type: string }
        event_type:
          type: string
          enum: [Sign in, Registration, Email confirmation, Round start, Round end, Deposit, Loyalty points, Tier assigned, Bonus wager, Transfer, Cash out requested, Cashout approved, KYC doc requested, KYC doc approved, Assign segment, Removed from segment]
        event_tag: { type: string, enum: [customer, game, finance, loyalty, bonus, compliance, segment] }
        session_id: { type: string }
        details:
          type: object
          description: Event-specific display fields (game/bonus external IDs, totals, payment method, wallets, documents, LP, tier or segment names).
          additionalProperties:
            oneOf:
              - { type: string }
              - { type: number }
        demo: { type: boolean }
    LoyaltyTierInput:
      type: object
      additionalProperties: false
      description: |
        LP formula is fixed to total bet amount (EUR) x game_weight x (1 / eur_per_point).
        Defaults are game_weight 1, eur_per_point 10, cashback 15 and rakeback 10.
        Qualification requires the threshold and ALL selected segments; empty segments allow everyone.
        UI tier/progress/statistics use current segment membership, not historical tier membership.
        These settings never automatically credit LP or issue rewards.
      properties: &LoyaltyProperties
        name: { type: string, minLength: 1, maxLength: 100 }
        minimum_points: { type: integer, minimum: 0, maximum: 9007199254740991, description: Unique within this casino }
        game_weight: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000, default: 1 }
        eur_per_point: { type: number, exclusiveMinimum: true, minimum: 0, maximum: 1000000, default: 10 }
        segment_ids: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string } }
        bonus_ids: { type: array, maxItems: 1000, uniqueItems: true, items: { type: string }, description: Nondeleted casino-owned bonuses }
        cashback: { type: number, minimum: 0, maximum: 100, default: 15 }
        rakeback: { type: number, minimum: 0, maximum: 100, default: 10 }
    LoyaltyTier:
      type: object
      properties:
        <<: *LoyaltyProperties
        id: { type: string, readOnly: true }
        casino_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
    ComplianceStatus:
      type: string
      enum: [New, Pending, Approved, Declined]
    ComplianceRecord:
      type: object
      required: [id, external_id, customer_id, casino_id, created_at, updated_at, status]
      properties:
        id: { type: string, readOnly: true }
        external_id: { type: string, readOnly: true }
        customer_id: { type: string }
        casino_id: { type: string, readOnly: true }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        status: { $ref: '#/components/schemas/ComplianceStatus' }
        demo: { type: boolean, readOnly: true }
        source: { type: string, enum: [synthetic_demo], readOnly: true }
        created_by: { type: string, readOnly: true }
        updated_by: { type: string, readOnly: true }
        audit:
          type: array
          readOnly: true
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              by: { type: string }
              from: { $ref: '#/components/schemas/ComplianceStatus' }
              to: { $ref: '#/components/schemas/ComplianceStatus' }
    CompliancePayout:
      allOf:
        - $ref: '#/components/schemas/ComplianceRecord'
        - type: object
          required: [amount, currency, payment_method]
          properties:
            amount: { type: number, description: Synthetic review amount only; never executed }
            currency: { type: string }
            payment_method: { type: string }
    ComplianceKyc:
      allOf:
        - $ref: '#/components/schemas/ComplianceRecord'
        - type: object
          required: [document_name, preview_url]
          properties:
            document_name: { type: string, maxLength: 200 }
            preview_url: { type: string, nullable: true, description: Static demo fixture for seeded rows; null for new requests }
    ComplianceAlert:
      allOf:
        - $ref: '#/components/schemas/ComplianceRecord'
        - type: object
          required: [last_session]
          properties:
            last_session:
              type: object
              required: [ip, country, at, device]
              properties:
                ip: { type: string, description: RFC 5737 documentation-only IP in demo data }
                country: { type: string }
                at: { type: string, format: date-time }
                device: { type: string }
    ComplianceRiskEntry:
      type: object
      additionalProperties: false
      required: [segment_id, score]
      properties:
        segment_id: { type: string, description: Unique ID of a segment in this casino }
        score: { type: integer, minimum: 0, maximum: 100 }
    ComplianceRiskMatrix:
      type: object
      additionalProperties: false
      required: [entries]
      properties:
        entries:
          type: array
          maxItems: 1000
          items: { $ref: '#/components/schemas/ComplianceRiskEntry' }
    ComplianceNotes:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            type: object
            required: [id, message, created_at]
            properties:
              id: { type: string }
              message: { type: string }
              created_at: { type: string, format: date-time }
              casino_id: { type: string }
              customer_id: { type: string }
              created_by: { type: string }
              internal: { type: boolean, enum: [true] }
    CopyGroups:
      type: array
      uniqueItems: true
      items: { type: string, enum: [segments, games, catalogs, payment_connections] }
    ClonePreview:
      type: object
      required: [source_id, source_revision, requested_groups, dependency_groups, counts]
      properties:
        source_id: { type: string }
        source_revision: { type: integer }
        requested_groups: { $ref: '#/components/schemas/CopyGroups' }
        dependency_groups: { $ref: '#/components/schemas/CopyGroups' }
        counts: { type: object, additionalProperties: { type: integer } }
    Ownership:
      type: object
      required: [casino_id]
      properties:
        casino_id: { type: string, readOnly: true, description: Assigned by server; cannot be transferred through ordinary writes }
    CasinoWebsiteWrite:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 120 }
        url: { type: string, format: uri, maxLength: 2048, description: Absolute HTTP(S) URL without credentials }
        theme: { type: string, enum: [classic, modern, dark] }
        enabled: { type: boolean, default: true, description: Stored configuration status only }
        source_id: { type: string, description: Creation only. Explicit permitted copy source; omitted means no copy }
        groups: { $ref: '#/components/schemas/CopyGroups' }
        source_revision: { type: integer, description: Creation only. Required when source_id is set; obtained from clone-preview }
    CasinoWebsite:
      type: object
      required: [id, name, url, theme, enabled, created_at, updated_at]
      properties:
        id: { type: string }
        name: { type: string }
        url: { type: string, format: uri }
        theme: { type: string, enum: [classic, modern, dark] }
        enabled: { type: boolean }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        clone:
          type: object
          nullable: true
          description: Creation result, requested/dependency groups and per-type counts; no credentials or membership history
          properties:
            requested_groups: { $ref: '#/components/schemas/CopyGroups' }
            dependency_groups: { $ref: '#/components/schemas/CopyGroups' }
            counts: { type: object, additionalProperties: { type: integer } }
    GameCategoryWrite:
      type: object
      description: Partial update; creation requires name. Copy sources add existing game references once on save (deduplicated), never duplicate game records or sync future changes. Dynamic categories cannot have fixed games, copy sources or automatic sorting. Unknown fields are rejected.
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
        cms_identifier: { type: string, pattern: '^[a-z][a-z0-9_-]{0,79}$', description: Unique CMS key. Defaults to a slug of the name on creation; preserved on rename. }
        game_ids: { type: array, uniqueItems: true, items: { type: string }, description: Ordered game references. Games can belong to many static categories. Empty for dynamic categories. }
        segments: { type: array, maxItems: 100, items: { type: string }, description: Saved customer segment names; existing names remain valid after renames. }
        tags: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 200 } }
        sort_mode: { type: string, enum: [manual, popularity, new, most_played], description: Manual preserves submitted order; other modes sort descending by demo popularity, creation date or demo play count. Ties use name then ID. }
        copy_provider_ids: { type: array, maxItems: 100, items: { type: string }, writeOnly: true }
        copy_category_ids: { type: array, maxItems: 100, items: { type: string }, writeOnly: true, description: Static categories other than this category. }
    GameCategory:
      allOf:
        - $ref: '#/components/schemas/Ownership'
        - $ref: '#/components/schemas/GameCategoryWrite'
        - type: object
          properties:
            id: { type: string, readOnly: true }
            kind: { type: string, enum: [static, dynamic], readOnly: true }
            dynamic_kind: { type: string, enum: [recent, favourites], readOnly: true, description: Present only for customer-specific dynamic definitions; no per-customer resolution in this catalog. }
    CatalogGameWrite:
      type: object
      description: Partial update; omitted fields retain their values. Unknown and read-only fields are rejected.
      properties:
        external_id: { type: string, minLength: 1, maxLength: 120, description: Unique user-friendly external identifier }
        name: { type: string, minLength: 1, maxLength: 120 }
        enabled: { type: boolean }
        category: { type: string, description: Legacy primary category; writing this alone replaces category membership with that one static category. Read value is empty if no memberships exist. }
        category_ids: { type: array, maxItems: 100, items: { type: string }, description: Static category IDs. Replaces all memberships for this game; does not reorder other games in the categories. }
        segments:
          type: array
          maxItems: 100
          items: { type: string }
          description: Saved customer segment names; existing names remain valid after segment renames.
        tags: { type: array, maxItems: 100, items: { type: string, minLength: 1, maxLength: 200 } }
        deposit_currencies:
          type: array
          minItems: 1
          maxItems: 100
          items: { type: string, enum: [EUR, USD, GBP, CAD, INR, BRL, MXN, TRY, AED, NGN, KES, ZAR, THB, VND, IDR, PHP, JPY, AUD, RUB, KZT, USDT, BTC] }
        rtp: { type: number, minimum: 0, maximum: 100 }
        bonus_contribution: { type: number, nullable: true, minimum: 0, maximum: 100, description: Override percentage; null inherits the provider default }
        multiplier: { type: number, minimum: 0, maximum: 1000000000 }
        variance: { type: string, enum: [low, medium, high] }
        attributes: { type: array, maxItems: 100, items: { type: string, enum: [jackpot, free_spins, desktop, mobile] } }
    CatalogGame:
      allOf:
        - $ref: '#/components/schemas/Ownership'
        - $ref: '#/components/schemas/CatalogGameWrite'
        - type: object
          properties:
            id: { type: string, readOnly: true }
            publisher_id: { type: string, readOnly: true }
            image: { type: string, readOnly: true, description: Catalogue image URL; synthetic SVG data URI for demo games without artwork }
            badges: { type: array, readOnly: true, items: { type: string, enum: [NEW, HOT, JACKPOT] } }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
            provider_bonus_contribution: { type: number, readOnly: true, minimum: 0, maximum: 100 }
            popularity: { type: integer, readOnly: true, minimum: 0, maximum: 100, description: Persisted demo popularity score }
            play_count: { type: integer, readOnly: true, minimum: 0, description: Persisted demo play count, not live analytics }
            statistics_source: { type: string, enum: [demo], readOnly: true }
    CustomerSegmentWrite:
      type: object
      additionalProperties: false
      required: [name, rules]
      properties:
        name: { type: string, minLength: 1, maxLength: 200 }
        tag_name: { type: string, nullable: true, maxLength: 200, description: Optional friendly label; blank or null clears it }
        rules: { $ref: '#/components/schemas/SegmentNode' }
    CustomerSegment:
      allOf:
        - $ref: '#/components/schemas/Ownership'
        - $ref: '#/components/schemas/CustomerSegmentWrite'
        - type: object
          properties:
            id: { type: string, readOnly: true, example: SG-1001 }
            created_at: { type: string, format: date-time, readOnly: true }
            updated_at: { type: string, format: date-time, readOnly: true }
            risk_score: { type: integer, minimum: 0, maximum: 100, default: 0, readOnly: true, description: Configured casino compliance matrix score, or zero if unconfigured }
    SegmentNode:
      description: |
        At most 100 total nodes and 5 nested levels. List comparisons match any
        selected value. Money rules require a wallet currency; net cash flow
        additionally requires days (1-36500). Missing metrics do not match under NOT.
      oneOf:
        - type: object
          additionalProperties: false
          required: [kind, operator, not, children]
          properties:
            kind: { type: string, enum: [group] }
            operator: { type: string, enum: [AND, OR] }
            not: { type: boolean }
            children: { type: array, minItems: 1, maxItems: 100, items: { $ref: '#/components/schemas/SegmentNode' } }
        - type: object
          additionalProperties: false
          required: [kind, field, operator, not, value]
          properties:
            kind: { type: string, enum: [rule] }
            field: { type: string, description: Key from /segments/parameters }
            operator: { type: string, enum: [IS, '=', '!=', '<', '>', '>=', '<=', '=<'] }
            not: { type: boolean }
            value:
              oneOf:
                - { type: number }
                - { type: boolean }
                - { type: string, format: date }
                - { type: array, minItems: 1, uniqueItems: true, items: { type: string } }
            currency: { type: string, description: Required for money rules }
            days: { type: integer, minimum: 1, maximum: 36500, description: Required only for net_cash_flow }
    CustomerUpdate:
      type: object
      additionalProperties: false
      properties: &CustomerProperties
        external_id: { type: string, minLength: 1, maxLength: 200 }
        name: { type: string, minLength: 1, maxLength: 200 }
        DocumentINo: { type: string, maxLength: 200 }
        country: { type: string, enum: [CA, US, BR, MX, AR, CL, PE, DE, FR, ES, IT, NL, PL, SE, GB, IE, AT, FI, RU, KZ, UA, UZ, AZ, AE, SA, TR, EG, MA, NG, ZA, KE, GH, TH, VN, ID, PH, MY, IN, JP, KR, AU, NZ, BD] }
        currency: { type: string, enum: [EUR, USD, GBP, CAD, INR, BRL, MXN, TRY, AED, NGN, KES, ZAR, THB, VND, IDR, PHP, JPY, AUD, RUB, KZT, USDT, BTC] }
        lang: { type: string, enum: [en, de, sv, pl, pt, fr, hi, ar, th] }
        addr1: { type: string, maxLength: 200 }
        addr12: { type: string, maxLength: 200 }
        mfa_type: { type: string, enum: [NONE, TOTP, SMS, EMAIL] }
        risk_score: { type: integer, minimum: 0, maximum: 100 }
        loyalty_points: { type: integer, minimum: 0, maximum: 9007199254740991, default: 0, description: Manually editable saved LP; never derived from bet counts }
        kyc_status: { type: string, enum: [NOT_STARTED, PENDING, VERIFIED, REJECTED] }
        birthday: { type: string, format: date }
        aml_status: { type: string, enum: [CLEAR, REVIEW, BLOCKED] }
        funnel_status: { type: string, enum: [Lead, Registered, FTD, Trusted, VIP, Dormant] }
        gender: { type: string, enum: [Female, Male, Non-binary, Undisclosed] }
        info: { type: string, maxLength: 4000 }
    Customer:
      type: object
      additionalProperties: false
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        legacy_groups: { type: array, readOnly: true, items: { type: string }, description: Preserved imported demo tags; not inferred real-time segment membership }
        <<: *CustomerProperties
        id: { type: string, readOnly: true, example: CU-1001 }
        created_at: { type: string, format: date-time, readOnly: true }
        updated_at: { type: string, format: date-time, readOnly: true }
        devices: { type: array, readOnly: true, items: { type: string, enum: [Desktop, Mobile, Tablet] } }
        sessions_per_week: { type: number, readOnly: true, description: Demo session frequency; not live analytics }
        bonus_wr_rate: { type: number, minimum: 0, maximum: 100, readOnly: true, description: Demo wagering completion percentage }
        activity:
          type: object
          readOnly: true
          description: Seeded demo activity; last session is a duration, not a timestamp.
          required: [last_login_at, last_session_hours, overall_game_hours]
          properties:
            last_login_at: { type: string, format: date-time, nullable: true }
            last_session_hours: { type: number, minimum: 0, example: 3 }
            overall_game_hours: { type: number, minimum: 0, example: 5000 }
        risk_indicators:
          type: array
          readOnly: true
          description: Seeded demo review signals, not verified risk findings.
          uniqueItems: true
          items:
            type: string
            enum: [rdw, multiple_payment_methods, pof_pow_violations, abnormal_activity, bonus_abuse, bot_activity, device_fingerprint_mismatches, failed_kyc_attempts, vpn_multiple_ips]
    Bonus:
      type: object
      required: [id, name, status, bonusType, hasPromo, createdAt, dateStart, dateEnd, event, bonusValue, wagered, wins, received, groups, deleted]
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        id: { type: string, example: BN-1001 }
        name: { type: string, example: Welcome Pack 100% }
        status: { type: string, enum: [active, inactive, auto] }
        bonusType: { type: string, enum: [dep match, no-deposit, free spins, cashback, multiplier] }
        hasPromo: { type: boolean }
        createdAt: { type: string, format: date }
        dateStart: { type: string, format: date }
        dateEnd: { type: string, format: date }
        event: { type: string, description: Event that gives the bonus, example: First deposit }
        bonusValue: { type: integer, description: Bonus value in EUR, example: 120000 }
        wagered: { type: integer, description: Total wagered in EUR, example: 96400 }
        wins: { type: integer, description: Total wins in EUR, example: 81200 }
        received: { type: integer, description: Number of players who received the bonus, example: 2140 }
        groups:
          type: array
          description: Segments (player groups) the bonus is available to
          items: { type: string }
          example: [first_dep, registered]
        deleted: { type: boolean }
    BonusPage:
      type: object
      required: [items, total, offset, limit, counts]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/Bonus' }
        total: { type: integer, description: Number of bonuses matching all filters and search }
        offset: { type: integer }
        limit: { type: integer }
        counts:
          type: object
          description: Facet counters. Each option is counted with the other groups' selections and the search applied, but not its own group's.
          required: [total, status, promo, bonusType]
          properties:
            total: { type: integer }
            status: { type: object, additionalProperties: { type: integer }, example: { active: 73, inactive: 27, auto: 36 } }
            promo: { type: object, additionalProperties: { type: integer }, example: { banner: 49, nobanner: 51 } }
            bonusType: { type: object, additionalProperties: { type: integer }, example: { dep match: 31, no-deposit: 1, free spins: 30, cashback: 8, multiplier: 30 } }
    Availability:
      type: object
      properties:
        startTime: { type: string, example: "2026-09-01T00:00", description: "YYYY-MM-DDTHH:MM" }
        endTime: { type: string, example: "2026-12-31T23:59", description: "Must be after startTime" }
        includeSegments:
          type: array
          description: "Customer segment names from GET /segments, or legacy registered, no_deposit, kyc_verified. Existing selections remain valid if a segment is renamed."
          items: { type: string }
        excludeSegments:
          type: array
          description: "Customer segment names from GET /segments, or legacy restricted_countries, restricted_currencies. Existing selections remain valid if a segment is renamed."
          items: { type: string }
    Triggers:
      type: object
      properties:
        event: { type: string, enum: [on_registration, on_deposit] }
        minDeposit: { type: number, description: EUR }
        maxDeposit: { type: number, description: "EUR, must be >= minDeposit" }
        depositNumber: { type: integer, minimum: 0 }
        minDepositCount: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: "Player must have made at least this many deposits. Empty means no minimum." }
        maxDepositCount: { type: integer, minimum: 0, maximum: 1000, nullable: true, description: "Player must have made at most this many deposits, must be >= minDepositCount. Empty means no maximum." }
    Games:
      type: object
      description: Games the bonus can be played on.
      properties:
        linkType: { type: string, enum: [categories, game], description: "categories - one or more game categories (empty list means all games); game - a single game" }
        categories:
          type: array
          items: { type: string, enum: [SLOTS, TABLE_GAMES, LIVE_CASINO, CRASH] }
        game: { type: string, nullable: true, description: "Game id from GET /games, required when linkType is game", example: gates-of-olympus }
    Reward:
      type: object
      properties:
        mode: { type: string, enum: [BONUS_MONEY, FREE_SPINS], description: "FREE_SPINS uses freeSpins; BONUS_MONEY uses dmp and maxBonusAmount" }
        freeSpins:
          type: object
          description: "Distribution example: 100 spins at 20 spins per day are given over 5 days"
          properties:
            quantity: { type: integer, minimum: 1, maximum: 10000, example: 100 }
            spinsPerDay: { type: integer, minimum: 1, description: "Must not exceed quantity; days = ceil(quantity / spinsPerDay)", example: 20 }
        dmp: { type: number, description: "Deposit match percentage. When 0, the bonus amount equals maxBonusAmount; otherwise min(deposit * dmp / 100, maxBonusAmount)", example: 50 }
        maxBonusAmount: { type: number, description: "EUR" }
    Wagering:
      type: object
      properties:
        multiplier: { type: number, example: 35 }
        timeToCompleteDays: { type: integer, example: 14 }
        maxBetPerRound: { type: number, description: EUR }
        appliesTo: { type: string, enum: [BONUS_ONLY, BONUS_PLUS_DEPOSIT, WINNINGS_ONLY] }
        maxWithdrawCap:
          type: object
          properties:
            type: { type: string, enum: [MULTIPLIER, FIXED] }
            value: { type: number, description: "EUR when FIXED, a multiplier otherwise" }
    WalletRules:
      type: object
      properties:
        deduction: { type: string, enum: [MAIN_WALLET_FIRST, BONUS_MONEY_FIRST] }
        winnings: { type: string, enum: [MAIN_WALLET_FIRST, BONUS_MONEY_FIRST] }
        allowCancelBeforeWagering: { type: boolean }
        allowWithdrawBeforeWagering: { type: boolean }
    AntiBonusHunter:
      type: object
      properties:
        maxClaimsPerIp: { type: integer, minimum: 0, maximum: 1000 }
        maxClaimsPerDevice: { type: integer, minimum: 0, maximum: 1000 }
        blockSharedIpSubnets: { type: boolean }
        blockKnownVpnsAndProxies: { type: boolean }
        paymentMethodBlacklist:
          type: array
          items: { type: string, enum: [SKRILL, NETELLER, CRYPTO] }
        requireKycLevelBeforeClaim: { type: string, enum: [NONE, VERIFIED_EMAIL, VERIFIED_ID, VERIFIED_ID_AND_ADDRESS] }
        maxBetPerRound: { type: number, description: EUR }
        maxBetPercentageOfBonus: { type: number, minimum: 0, maximum: 100 }
        restrictZeroRiskBetting: { type: boolean }
        minEvenMoneyCoveragePercentage: { type: number, minimum: 0, maximum: 100, description: "Shown as Anti-hedging threshold. Applies to Roulette/Baccarat: stops betting on 50/50 outcomes" }
    PromoBanner:
      type: object
      description: Banner shown on the casino web site. Target segments are the bonus include segments.
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        images:
          type: object
          description: Data URLs (png, jpeg, webp, gif; max about 2 MB each) or null
          properties:
            web: { type: string, nullable: true }
            tablet: { type: string, nullable: true }
            mobile: { type: string, nullable: true }
        title: { type: string, description: HTML, maxLength: 20000 }
        description: { type: string, description: HTML, maxLength: 20000 }
        buttons:
          type: object
          properties:
            depositForSignedUsers: { type: boolean }
            signUpForAnonymous: { type: boolean }
        pages:
          type: object
          properties:
            home: { type: boolean }
            welcome: { type: boolean }
    PromoCode:
      type: object
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        code: { type: string, example: PROMO-7H3K9P2Q }
        startTime: { type: string, example: "2026-09-01T00:00" }
        endTime: { type: string, example: "2026-12-31T23:59" }
        createdAt: { type: string, format: date-time }
    BonusUpdate:
      type: object
      properties:
        name: { type: string, maxLength: 120 }
        description: { type: string, maxLength: 2000 }
        status: { type: string, enum: [active, inactive] }
        bonusType: { type: string, enum: [dep match, no-deposit, free spins, cashback, multiplier] }
        category: { type: string, enum: [SLOTS, TABLE_GAMES, LIVE_CASINO, CRASH] }
        availability: { $ref: '#/components/schemas/Availability' }
        triggers: { $ref: '#/components/schemas/Triggers' }
        games: { $ref: '#/components/schemas/Games' }
        reward: { $ref: '#/components/schemas/Reward' }
        wagering: { $ref: '#/components/schemas/Wagering' }
        walletRules: { $ref: '#/components/schemas/WalletRules' }
        antiBonusHunter: { $ref: '#/components/schemas/AntiBonusHunter' }
    BonusCreate:
      allOf:
        - $ref: '#/components/schemas/BonusUpdate'
        - type: object
          required: [name, description, status, bonusType, category, availability, triggers, reward, wagering, walletRules, antiBonusHunter]
    BonusDetail:
      allOf:
        - $ref: '#/components/schemas/Bonus'
        - $ref: '#/components/schemas/BonusUpdate'
        - type: object
          properties:
            createdBy: { type: string, example: v.kovalevskiy }
    ChangelogEntry:
      type: object
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        at: { type: string, format: date-time }
        by: { type: string }
        summary: { type: string }
        changes:
          type: array
          items:
            type: object
            properties:
              field: { type: string, example: reward.dmp }
              from: {}
              to: {}
    ExchangeRates:
      type: object
      properties:
        casino_id: { type: string, readOnly: true, description: Immutable owning casino }
        base: { type: string, example: EUR }
        rates: { type: object, additionalProperties: { type: number }, example: { USD: 1.08, GBP: 0.85 } }
        updatedAt: { type: string, format: date-time }
        updatedBy: { type: string }
    ValidationError:
      type: object
      properties:
        error: { type: string, example: Validation failed }
        fields:
          type: object
          additionalProperties: { type: string }
          example: { "reward.dmp": "Must be a number between 0 and 1000" }
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in, scope]
      properties:
        access_token: { type: string, description: "Signed JWT (HS256) with claims iss, sub, aud, iat, nbf, exp, jti, scope" }
        token_type: { type: string, example: Bearer }
        expires_in: { type: integer, example: 900 }
        scope: { type: string, example: "bonuses:read bonuses:write" }
    OAuthError:
      type: object
      properties:
        error: { type: string, example: invalid_token }
        error_description: { type: string }
    Error:
      type: object
      properties:
        error: { type: string }
