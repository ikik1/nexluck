<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextLuck CRM — Payment cascades</title><link rel="stylesheet" href="/crm/crm.css?v=202610131950"><link rel="stylesheet" href="/crm/f/f.css?v=202610121736">
<style>
.wf{position:relative;padding:4px 0 8px}
.step{position:relative;display:grid;grid-template-columns:34px 1fr auto;gap:8px 12px;align-items:center;background:#fff;border:1px solid #9bbde6;border-left:5px solid var(--brand);border-radius:8px;padding:10px 12px;box-shadow:0 2px 6px #0b5cab22;max-width:calc(100% - var(--off))}
.sn{width:30px;height:30px;border-radius:50%;background:var(--brand);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px}
.sname{font-weight:700;font-size:14px}
.sval{display:flex;align-items:center;gap:6px;font-size:12px;color:#444;margin-top:4px;flex-wrap:wrap}
.sval input,.sval select{padding:5px 8px;border:1px solid var(--line);border-radius:6px;font-size:13px;font-family:inherit}
.sval input{width:72px}
.sact{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.ib{border:1px solid #cfcfcf;background:#fff;border-radius:6px;padding:4px 9px;font-size:12px;cursor:pointer;font-family:inherit}
.ib:hover:not(:disabled){border-color:var(--brand);color:var(--brand)}
.ib:disabled{opacity:.4;cursor:not-allowed}
.ib.del:hover:not(:disabled){border-color:var(--red);color:var(--red)}
.arrow{display:flex;align-items:center;gap:8px;height:30px;font-size:12px;color:var(--muted)}
.arrow svg{width:18px;height:26px;flex:none}
.pick{grid-column:1 / -1;border-top:1px dashed #cfcfcf;padding-top:8px}
.pick input{width:100%;padding:8px 10px;border:1px solid var(--brand);border-radius:6px;font-size:13px}
.pick ul{list-style:none;max-height:170px;overflow:auto;border:1px solid var(--line);border-radius:6px;margin-top:4px}
.pick li{padding:7px 10px;font-size:13px;cursor:pointer;display:flex;justify-content:space-between;gap:10px}
.pick li:hover,.pick li.hl{background:#eef5fc}
.pick li small{color:var(--muted)}
.cfg{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 14px}
.sec{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin:6px 0 8px}
.err{color:var(--red);font-size:12px;margin:4px 0}
.dfoot{display:flex;justify-content:flex-end;gap:8px;margin-top:14px;position:sticky;bottom:0;background:#fff;padding-top:8px}
.ed{width:1%}
.edit{border:1px solid #cfcfcf;background:#fff;border-radius:6px;padding:5px 7px;cursor:pointer;line-height:0}
.edit:hover{border-color:var(--brand)}
.edit svg{width:16px;height:16px;fill:none;stroke:var(--brand);stroke-width:1.6}
@media(max-width:600px){.step{grid-template-columns:34px 1fr}.sact{grid-column:1 / -1;justify-content:flex-start}}
</style></head>
<body><header id="hdr"></header><div class="subbar" id="sub"></div>
<main><h1>⇢ Payment Cascades and Routing</h1><p class="lead">Define how transactions fall through payment systems when a gateway under-performs or declines.</p><div id="root"></div></main><footer id="ftr"></footer>
