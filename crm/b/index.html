<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NextLuck CRM — Bonuses</title><link rel="stylesheet" href="/crm/crm.css?v=2">
<style>
main{max-width:1600px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:16px 0 12px}
.search{flex:1;min-width:240px;padding:10px 14px;border:1px solid var(--line);border-radius:8px;font-size:14px}
.new-actions{display:flex;gap:8px;align-items:center;margin-left:auto}
.new-btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--brand);border-radius:6px;background:#fff;color:var(--brand);padding:9px 13px;font-size:13px;font-weight:600;white-space:nowrap;cursor:pointer}
.new-btn:hover{background:#eef5fc}
.new-btn.ai{background:var(--brand);color:#fff}.new-btn.ai:hover{background:#094a8a}
.filters{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;margin-bottom:12px}
.fgroup{display:flex;flex-wrap:wrap;align-items:center;gap:5px}
.ftitle{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-right:2px}
.chip{display:inline-flex;align-items:center;gap:5px;background:#fff;border:1px solid #cfcfcf;border-radius:99px;padding:3px 10px;font-size:12px;color:#444;cursor:pointer;text-transform:capitalize;line-height:1.5}
.chip:hover{border-color:var(--brand);color:var(--brand)}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip span{background:#00000014;border-radius:99px;padding:0 6px;font-size:10px}
.chip.on span{background:#ffffff33}
.wrap{background:#fff;border:1px solid var(--line);border-radius:4px;overflow-x:auto}
table.bt{min-width:1100px;border-collapse:collapse;width:100%;font-size:13px}
.bt th{background:#f3f3f3;color:#444;font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.3px;padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid #e5e5e5;white-space:nowrap;position:sticky;top:0}
.bt td{padding:8px 12px;border-bottom:1px solid var(--line);border-right:1px solid #f0f0f0;vertical-align:middle}
.bt th:last-child,.bt td:last-child{border-right:0}
.bt tbody tr:hover{filter:brightness(.96)}
.bt tr.active{background:#eaf6ee;box-shadow:inset 4px 0 0 var(--green)}
.bt tr.inactive{background:#f1f1f1;color:#6b6b6b;box-shadow:inset 4px 0 0 #9a9a9a}
.bt tr.auto{background:#eef2ff;box-shadow:inset 4px 0 0 #5a4fcf}
.bt th:first-child,.bt td.bn{min-width:250px;width:250px}
.bt td.bn{padding:0}
.bn-top{padding:8px 12px;white-space:nowrap}
.bn-bot{padding:3px 12px;min-height:22px;border-top:1px dashed #cfcfcf;display:flex;align-items:center;gap:6px;background:#00000008}
.bn-bot .info{width:12px;height:12px;font-size:9px;margin:0}
.bn-bot .info:hover::after{left:16px;top:-6px;font-size:11px}
.bn-bot .promo{font-size:8px;padding:0 5px;margin:0;line-height:14px}
.bt .name{color:var(--brand);font-weight:600}
.info{display:inline-grid;place-items:center;width:16px;height:16px;border-radius:50%;background:var(--brand);color:#fff;font-size:11px;font-style:italic;cursor:help;margin-left:6px;position:relative}
.info:hover::after{content:attr(data-id);position:absolute;left:22px;top:-4px;background:#222;color:#fff;font-style:normal;padding:3px 8px;border-radius:4px;white-space:nowrap;z-index:5}
.promo{white-space:nowrap;display:inline-block;margin-top:2px;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;margin-left:8px;background:#fff3d6;color:#8a5a00;border:1px solid #f5b942;text-transform:uppercase}
.st{font-weight:600;white-space:nowrap}.st.on{color:var(--green)}.st.off{color:#777}
.pb{width:170px}.pb .bar{height:8px;background:#ddd;border-radius:4px;overflow:hidden}.pb .bar i{display:block;height:100%;background:var(--brand)}
.pb small{font-size:11px;color:var(--muted)}
.num{white-space:nowrap}.empty{padding:30px;text-align:center;color:var(--muted)}
.give a{color:var(--brand);text-decoration:underline}
.grp{white-space:nowrap}
.edit{display:inline-grid;place-items:center;width:30px;height:30px;background:none;border:1px solid transparent;border-radius:6px;cursor:pointer;color:var(--brand);padding:5px}
.edit svg{width:17px;height:17px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.edit:hover{background:#eef5fc;border-color:#c9d9eb}
.bt tr.deleted{background:#fbeaea;color:#999;box-shadow:inset 4px 0 0 #c23934}.bt tr.deleted .name{text-decoration:line-through;color:#999}
.bt td.ed{text-align:center}
#ctx{position:fixed;display:none;z-index:50;min-width:170px;background:#fff;border:1px solid var(--line);border-radius:6px;box-shadow:0 4px 16px #0003;padding:4px 0;font-size:13px}
#ctx div{padding:7px 16px;cursor:pointer}#ctx div:hover{background:#f0f0f0}
#ctx div.dis{color:#aaa;cursor:not-allowed}#ctx div.dis:hover{background:none}
.more{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px}
.more button{background:#fff;border:1px solid var(--line);color:var(--brand);padding:8px 24px;border-radius:4px;font-size:14px;font-weight:600;cursor:pointer}
.more button:hover{background:#f3f3f3}.more small{color:var(--muted);font-size:12px}
@media(max-width:760px){.new-actions{width:100%;margin-left:0}.new-btn{flex:1;justify-content:center}}
</style></head>
<body><header id="hdr"></header><div class="subbar" id="sub"></div>
<main><h1>🎁 Bonuses / Promotion</h1><p class="lead">Manage bonuses and track their performance.</p>
<div id="root"></div>
</main><footer id="ftr"></footer>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js" crossorigin></script>
<script src="/crm/data.js"></script>
<script>chrome('<span class="crumb"><a href="/crm/">Home</a> / Bonuses / Promotion</span>');</script>
<script type="text/babel" src="/crm/b/BonusList.jsx"></script>
</body></html>
